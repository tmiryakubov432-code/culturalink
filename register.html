<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaLink | Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#111111', secondary: '#333333', light: '#f9fafb', border: '#e5e7eb' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="styles.css?v=3">
    
    <script>
        if (localStorage.getItem('isRegistered') === 'true') {
            document.documentElement.classList.add('logged-in');
        }
    </script>
</head>
<body class="font-sans bg-gray-50 text-gray-900 antialiased flex flex-col min-h-screen overflow-y-scroll">
    
    <nav class="fixed w-full bg-transparent z-50 transition-colors duration-300 border-b border-transparent h-[80px]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="tilt-hitbox inline-block">
                <a href="index.html" class="tilt-inner text-primary font-bold text-xl tracking-tight inline-block">CulturaLink.</a>
            </div>
            <div class="hidden md:flex space-x-8 items-center">
                <div class="tilt-hitbox inline-block"><a href="index.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Главная</a></div>
                <div class="tilt-hitbox inline-block"><a href="features.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Возможности</a></div>
                <div class="tilt-hitbox inline-block"><a href="communities.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Сообщества</a></div>
                <div class="tilt-hitbox inline-block"><a href="events.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">События</a></div>
                <div class="tilt-hitbox inline-block"><a href="chat.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Чат</a></div>
            </div>
        </div>
    </nav>
    
    <main class="flex-grow flex items-center justify-center pt-[80px] pb-12 px-4">
        <div class="w-full max-w-md fade-in-up">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-primary tracking-tight mb-2">Создать аккаунт</h1>
                <p class="text-gray-500">Доступ к закрытым комнатам</p>
            </div>
            
            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8 tilt-element">
                <form onsubmit="handleRegistration(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Имя</label>
                        <input type="text" id="name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-gray-900 transition-colors" placeholder="Иван">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-gray-900 transition-colors" placeholder="mail@example.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Пароль</label>
                        <input type="password" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-gray-900 transition-colors" placeholder="••••••••">
                    </div>
                    
                    <div class="mb-8 flex items-start gap-3">
                        <input type="checkbox" id="terms-checkbox" required class="mt-1 w-4 h-4 border-gray-300 rounded text-primary focus:ring-primary cursor-pointer">
                        <label for="terms-checkbox" class="text-sm text-gray-600 leading-tight cursor-pointer select-none">
                            Я принимаю <a href="privacy.html" class="text-primary font-bold hover:underline">политику конфиденциальности</a> и <a href="terms.html" class="text-primary font-bold hover:underline">условия пользования</a>
                        </label>
                    </div>

                    <div class="tilt-hitbox w-full block">
                        <button type="submit" class="tilt-inner w-full bg-primary hover:bg-gray-800 text-white font-medium py-3.5 rounded-xl transition-all shadow-sm">
                            Зарегистрироваться
                        </button>
                    </div>

                    <div class="mt-8 text-center">
                        <div class="inline-flex items-center gap-2 text-[10px] font-bold text-gray-400 uppercase tracking-[0.25em]">
                            <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                            Регистрация абсолютно бесплатна
                            <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-200 py-10 bg-white mt-auto text-center">
        <div class="max-w-7xl mx-auto px-4">
            <div class="tilt-hitbox inline-block">
                <div class="tilt-inner text-xl font-bold text-primary mb-2 inline-block">CulturaLink.</div>
            </div>
            <p class="text-sm text-gray-500 mt-2">© 2026. Строгая платформа культурного обмена.</p>
        </div>
    </footer>
    <script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
