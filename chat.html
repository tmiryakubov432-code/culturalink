<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaLink | Чат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#111111', secondary: '#333333', light: '#f9fafb', border: '#e5e7eb' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="styles.css?v=3">
    
    <script>
        if (localStorage.getItem('isRegistered') === 'true') {
            document.documentElement.classList.add('logged-in');
        }
    </script>
</head>
<body class="font-sans bg-gray-50 text-gray-900 antialiased flex flex-col min-h-screen overflow-hidden">
    
    <nav class="fixed w-full bg-white z-50 border-b border-gray-200 h-[80px]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="tilt-hitbox inline-block">
                <a href="index.html" class="tilt-inner text-primary font-bold text-xl tracking-tight inline-block">CulturaLink.</a>
            </div>
            <div class="hidden md:flex space-x-8 items-center">
                <div class="tilt-hitbox inline-block"><a href="index.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Главная</a></div>
                <div class="tilt-hitbox inline-block"><a href="features.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Возможности</a></div>
                <div class="tilt-hitbox inline-block"><a href="communities.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">Сообщества</a></div>
                <div class="tilt-hitbox inline-block"><a href="events.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">События</a></div>
                <div class="tilt-hitbox inline-block"><a href="chat.html" class="tilt-inner text-primary font-bold text-sm inline-block">Чат</a></div>
                <div class="tilt-hitbox inline-block">
                    <a href="register.html" class="tilt-inner bg-primary text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-secondary transition inline-block shadow-sm">Присоединиться</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="flex-grow pt-[80px] pb-6 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full h-screen flex flex-col fade-in-up relative">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm flex flex-grow overflow-hidden relative z-10 mt-6">
            <div class="w-full md:w-80 border-r border-gray-200 bg-gray-50 flex flex-col hidden md:flex z-10">
                <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="font-bold text-primary text-lg">Комнаты</h2>
                    <button id="chat-add-btn" class="w-8 h-8 rounded-full bg-white border border-gray-200 text-primary flex items-center justify-center hover:bg-gray-900 hover:text-white transition-all shadow-sm" title="Найти комнату">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-1 chat-scroll" id="chat-sidebar-list"></div>
            </div>

            <div class="flex-1 flex flex-col bg-white relative">
                <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-white">
                    <div>
                        <h3 class="font-bold text-primary text-lg" id="chat-header-title">Выберите комнату</h3>
                        <p class="text-xs text-gray-500" id="chat-header-desc">Для начала общения</p>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-6 bg-gray-50/50 chat-scroll" id="chat-messages-container"></div>
                <div class="p-5 bg-white border-t border-gray-200">
                    <div class="flex gap-3">
                        <input type="text" id="chat-input" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-5 py-3 outline-none focus:border-gray-900 transition-colors text-sm" placeholder="Написать сообщение...">
                        <button id="chat-send-btn" class="bg-primary text-white px-6 py-3 rounded-xl hover:bg-gray-800 transition-colors font-medium">Отправить</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="add-room-modal" class="modal-overlay fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center">
            <div class="modal-content bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-lg text-primary">Доступные комнаты</h3>
                    <button id="close-modal-btn" class="text-gray-400 hover:text-gray-900 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="p-5 space-y-3 max-h-[60vh] overflow-y-auto chat-scroll" id="modal-rooms-list"></div>
            </div>
        </div>
    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
