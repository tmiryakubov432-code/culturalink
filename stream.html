<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulturaLink | Стрим</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#111111', secondary: '#333333', light: '#f9fafb', border: '#e5e7eb' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="font-sans bg-gray-50 text-gray-900 antialiased flex flex-col h-screen overflow-hidden">
    
    <nav class="fixed w-full bg-white z-50 border-b border-gray-200 h-[80px]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">
            <div class="tilt-hitbox inline-block">
                <a href="index.html" class="tilt-inner text-primary font-bold text-xl tracking-tight inline-block">CulturaLink.</a>
            </div>
            <div class="hidden md:flex space-x-8 items-center">
                <div class="tilt-hitbox inline-block">
                    <a href="communities.html" class="tilt-inner text-gray-500 hover:text-primary text-sm font-medium transition inline-block">&larr; Назад к сообществам</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="flex-grow pt-[80px] max-w-5xl mx-auto w-full h-full overflow-y-auto chat-scroll px-4 pb-20">
        <div class="fade-in-up mt-8">
            <div class="w-full bg-gray-900 rounded-2xl aspect-video relative flex items-center justify-center group overflow-hidden shadow-sm">
                <span class="text-gray-500 font-medium">Трансляция из Мехико...</span>
                
                <div class="absolute top-4 left-4 bg-gray-900 border border-gray-700 text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider flex items-center gap-2">
                    <span class="live-dot" style="background-color: white;"></span> Прямой эфир
                </div>
            </div>

            <div class="mt-8 bg-white border border-gray-200 rounded-2xl p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 flex items-center gap-2">
                            <span class="live-dot"></span> Мексиканская Кухня • Шеф Карлос
                        </div>
                        <h2 class="text-xl font-bold text-primary">Интерактив: Секретный ингредиент</h2>
                    </div>
                    <div id="stream-score-display" class="bg-gray-50 border border-gray-200 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm">
                        Баллы: 0
                    </div>
                </div>
                <p class="text-gray-900 font-medium mb-6">Шеф только что добавил специю в соус. Как вы думаете, что это было?</p>
                
                <div class="grid grid-cols-2 gap-3" id="poll-container">
                    <button onclick="handleStreamPoll(this, false)" class="p-3 bg-white border border-gray-300 rounded-xl text-sm font-medium text-gray-900 hover:border-gray-900 hover:-translate-y-1 hover:shadow-sm transition-all">Орегано</button>
                    <button onclick="handleStreamPoll(this, true)" class="p-3 bg-white border border-gray-300 rounded-xl text-sm font-medium text-gray-900 hover:border-gray-900 hover:-translate-y-1 hover:shadow-sm transition-all">Кориандр (Эпазоте)</button>
                    <button onclick="handleStreamPoll(this, false)" class="p-3 bg-white border border-gray-300 rounded-xl text-sm font-medium text-gray-900 hover:border-gray-900 hover:-translate-y-1 hover:shadow-sm transition-all">Корица</button>
                    <button onclick="handleStreamPoll(this, false)" class="p-3 bg-white border border-gray-300 rounded-xl text-sm font-medium text-gray-900 hover:border-gray-900 hover:-translate-y-1 hover:shadow-sm transition-all">Базилик</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
